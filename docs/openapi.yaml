openapi: 3.1.0
info:
  title: FundFlow REST API
  version: "1.0.0"
  description: |
    Multi-tenant VC/PE fund management platform. Covers accounts, organizations,
    Vehicles, entities, members, invites, portfolio data, and authentication.

    ## Authentication
    Two methods are accepted on every `/api/*` endpoint:

    1. **Session cookie** — set by `POST /api/auth/login`. Used by the web UI.
    2. **Bearer token** — `Authorization: Bearer ff_<48 hex chars>`. Generated
       via `POST /api/auth/tokens` (admin-only). Tokens inherit the owner's
       account roles, so an admin token can hit admin-only routes; a non-admin
       token only sees what its owner is allowed to see.

    Token CRUD itself (`/api/auth/tokens` routes) and `/api/auth/change-password`
    require a real session cookie — never a bearer token — so a leaked token
    cannot mint more tokens or lock the user out of their account.

    ## Permissions model
    - **admin** role: full access. Can create/delete organizations, delete any
      account/Vehicle/entity, and manage API tokens.
    - **non-admin**: scoped to data they participate in (org member/organizer,
      Vehicle member, entity manager/owner).
    - Permission checks happen identically for cookie- and token-authenticated
      requests.

    ## Errors
    Errors are JSON: `{ "message": "…" }`. A 4xx message describes what was
    wrong with the request. An unexpected server error (5xx) always reads
    `Internal Server Error` — the details are only in the server log.

  contact:
    name: FundFlow

servers:
  - url: /
    description: Same-origin (web app and API share a host)

tags:
  - name: Discovery
    description: API discovery — fetch this OpenAPI spec or browse the docs UI
  - name: Auth
    description: Login, logout, password management, and the current account
  - name: API Tokens
    description: Personal access tokens (admin-only)
  - name: Accounts
    description: User accounts and roles
  - name: Organizations
    description: Tenant organizations and their public landing pages
  - name: Organization Members
    description: Membership requests and approvals
  - name: Organization Invites
    description: Single-use invite tokens
  - name: Vehicles
    description: |
      Investment vehicles (SPVs, funds, etc.) and their investors.

      **Share classes.** Every Vehicle has share classes — "sub-vehicles" with
      segregated investors and assets — and every position and asset belongs to
      one. A Vehicle is created with one class ("Class A") and always keeps at
      least one; apps show classes only once a Vehicle has several, so a
      single-class Vehicle looks like it has none. Each class is its own pool: its
      cash (its investors' `totalCalled` − its assets' `cost`), asset value,
      ownership shares and AutoDeploy default asset are computed within the class.
      Investors only see the classes — and those classes' assets — they hold
      positions in.
  - name: Entities
    description: |
      Legal entities (LLCs, Corps, Trusts) with owners and delegates. An
      entity can't act by itself: accounts act for it through delegations
      (see [Delegations](#tag/Delegations)), and it always has at least one `manager`.
  - name: Introductions
    description: |
      Who introduced whom (admin-only), to track network growth and referral
      fees. An account can be introduced by several accounts and can
      introduce accounts and entities. Account introductions may never form
      a loop (if A introduced B and B introduced C, C can't introduce A or B),
      and an account can't introduce an entity managed by itself or by
      anyone upstream of it.

      Entities inherit their managers' introducers: if X introduced M, every
      entity M manages (a `manager`-level entity delegation) also counts as
      introduced by X. Those rows carry `viaAccountId` and are kept in sync
      automatically when introductions or entity delegations change; they
      can't be edited or deleted directly. Observers pass nothing on.
  - name: Delegations
    description: |
      A principal — an account or an entity — lets a delegate account (an
      attorney, accountant, family member…) act on its behalf. Only accounts
      can be delegates. Levels:

      - `observer` — the delegate reads what the principal can read.
        For an account: its profile, portfolio
        (`GET /api/portfolio?accountId=`), the entities it is a delegate of,
        its positions in Vehicles, and its documents (including those of
        entities it owns or is a delegate of). For an entity: the entity, its
        owners, delegates, portfolio and documents.
      - `manager` — additionally changes what the principal can change:
        an account's profile (`PATCH /api/accounts/{id}`, roles excluded) and
        the entities it manages; an entity's details, owners and delegations.

      An account delegate reaches its principal's entities at the lower of the
      two levels. Delegation is otherwise not transitive (a delegate of a
      delegate gets nothing) and never extends to the principal's admin role
      or organizer powers.

      **Who changes them:** an account's delegations, admins only; an
      entity's, admins and the entity's managers.

      **Entities can't act by themselves**, so they're created with at least
      one manager (`POST /api/entities`) and the last manager-level
      delegation can't be removed or downgraded (409). Entity delegations
      used to be "entity managers"; existing managers became `manager`-level
      delegations.
  - name: Relationships
    description: |
      Personal ties between two accounts (admin-only), read as
      "<from> is the <description> of <to>" — e.g. "wife", "brother",
      "ex-husband". One row per direction, so "wife" and "husband" can both
      be recorded. Informational only: they grant no access.
  - name: Promoters
    description: |
      Introducers that, after vetting and signing a contract, earn commissions
      on what their introductions pay us (admin-only). One promoter per
      account. Each promoter has up to one incentive of each type:

      - `management_fee` — `percent` of the management fee paid to us by the
        accounts and entities the promoter introduced.
      - `success_fee` — `percent` of the success fee we earn from them.

      `percent` is a share of that fee (0 < percent ≤ 100, two decimals),
      returned as a numeric string (e.g. `"20.00"`).
  - name: Contracts
    description: |
      Contracts sent for e-signature through ConcordNow (admin-only). Each
      contract has a `kind` and links to its subject (for now, promoter
      agreements via `promoterId`). FundFlow caches the Concord status; ask
      for a fresh one with `POST /api/contracts/{id}/refresh`.

      Needs the `CONCORD_API_KEY` env var and the Concord organization id;
      each kind also needs its template. Everything but the key is set in
      `PATCH /api/settings/concord` (Settings → Contracts).
      Concord failures answer 502 with Concord's reason; missing
      configuration answers 503.
  - name: Portfolio
    description: Investment positions held by accounts and entities
  - name: Documents
    description: |
      Files attached to either an Account or an Entity, organized in a
      user-defined folder tree. Visibility for non-admin callers is scoped to
      documents owned by their account, plus documents owned by entities they
      own (recursively, via `entity_owners`) or are delegates of (see [Delegations](#tag/Delegations)).
      Upload, delete, and storage settings are admin-only.
  - name: Settings
    description: Platform-wide settings (admin-only)
  - name: Currencies
    description: |
      The platform's currency catalog and daily FX rates. Vehicles are
      denominated in one of the *active* currencies (USD and EUR by
      default); the dashboard uses the rates here to consolidate
      multi-currency investments into a single selected display currency.
      Reading is open to any authenticated user; activating/deactivating a
      currency and forcing a refresh are admin-only.

# ──────────────────────────────────────────────────────────────────────────────
# Reusable security
# ──────────────────────────────────────────────────────────────────────────────
security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  # ──── Discovery (public) ──────────────────────────────────────────────────
  /api/openapi.json:
    get:
      tags: [Discovery]
      summary: This OpenAPI 3.1 spec as JSON
      description: |
        Public — no authentication required. Use this to bootstrap an API
        client (e.g. Postman import, openapi-generator, or an LLM agent's
        function-calling layer).
      security: []
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/json:
              schema: { type: object }

  /api/openapi.yaml:
    get:
      tags: [Discovery]
      summary: This OpenAPI 3.1 spec as YAML (source of truth)
      security: []
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/yaml:
              schema: { type: string }

  /docs:
    get:
      tags: [Discovery]
      summary: Human-readable API documentation (Redoc UI)
      security: []
      responses:
        '200':
          description: HTML page rendering the OpenAPI spec
          content:
            text/html:
              schema: { type: string }

  # ──── Auth ────────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated. Sets a session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the current session cookie
      security: []
      responses:
        '200': { description: Logged out (always 200 even if no session existed) }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently-authenticated account
      description: Works with both session cookies and bearer tokens.
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current account's password
      description: Session-only — cannot be called with a bearer token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                language:
                  type: string
                  enum: [en, es, fr]
                  description: Locale of the page the request was made from. The reset email is sent in this language; falls back to the account's saved language if omitted.
      responses:
        '200': { description: Always returns 200 (does not leak account existence) }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Consume a password reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ──── API Tokens (admin-only) ─────────────────────────────────────────────
  /api/auth/tokens:
    get:
      tags: [API Tokens]
      summary: List the caller's API tokens
      description: Admin-only. Session-only (bearer tokens cannot list tokens).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of tokens (no plaintext, no hashes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicApiToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [API Tokens]
      summary: Create a new API token
      description: |
        Admin-only. Session-only. The plaintext token is returned in the
        response under `token` and is **never retrievable again** — store it
        immediately.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, example: "CI pipeline" }
                expiresInDays:
                  type: integer
                  minimum: 1
                  description: If omitted, the token never expires.
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicApiToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        pattern: '^ff_[0-9a-f]{48}$'
                        description: Full plaintext token. Shown only once.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [API Tokens]
      summary: Revoke a token
      description: |
        Admin-only. Session-only. Scoped to caller's accountId — you cannot
        revoke another admin's tokens.
      security:
        - sessionCookie: []
      responses:
        '200': { description: Token revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Token not found or already revoked }

  # ──── Accounts ────────────────────────────────────────────────────────────
  /api/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: |
        Admins see all accounts (with optional `?search=` and `?role=` filters).
        Non-admins receive their own account first, followed by the accounts
        that delegated to them (see [Delegations](#tag/Delegations)).
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
      responses:
        '200':
          description: Accounts (passwordHash always stripped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
    post:
      tags: [Accounts]
      summary: Create a new account (admin only)
      description: |
        Admin only. There is no self-signup via the API — new users are created
        by an admin or join through an organization invite
        (`POST /api/invites/{token}/accept`).

        **Password is optional.** The welcome email (on by default) depends on it:
        - **With `password`** — the email contains the username and password.
        - **Without `password`** — the account cannot log in yet; the email
          contains the username and a link to create a password (valid 7 days,
          single use). If it expires, the user can use "Forgot your password?".

        Omitting `password` while sending `welcome_email: false` is rejected
        with 400, since the user would have no way to sign in.

        The response includes `welcomeEmail` so callers can tell whether the
        email actually went out. A failed send does not roll back the account
        (still 201) — follow up with a password reset or set a password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - type: object
                    required: [welcomeEmail]
                    properties:
                      welcomeEmail:
                        type: string
                        enum: [sent, failed, skipped]
                        description: |
                          `sent` — welcome email delivered to the SMTP server.
                          `failed` — sending failed; the account was still created.
                          `skipped` — `welcome_email: false` was sent.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Email already registered }

  /api/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Accounts]
      summary: Get a single account
      description: |
        Admins can get any account; others their own and those that delegated
        to them (see [Delegations](#tag/Delegations)).
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - type: object
                    required: [access]
                    properties:
                      access:
                        type: string
                        enum: [admin, self, observer, manager]
                        description: How the caller reaches this account — `observer`/`manager` through a delegation.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      summary: Update account fields and/or roles
      description: |
        Admins can update any account; others their own and those that made
        them a `manager` delegate (see [Delegations](#tag/Delegations)). Only admins can change roles
        or set a password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: |
            Updated. When `password` was set, the response also includes
            `welcomeEmail` (`sent`, `failed` or `skipped`); a failed send does
            not undo the password change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - type: object
                    properties:
                      welcomeEmail:
                        type: string
                        enum: [sent, failed, skipped]
                        description: Present only when `password` was set.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Accounts]
      summary: Delete an account (admin-only)
      description: Cascades to account_roles, api_tokens, introductions, delegations and relationships.
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/accounts/{id}/introductions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Introductions]
      summary: An account's introductions (admin-only)
      description: |
        `introducedBy` lists who introduced this account; `introduced` lists
        the accounts and entities it introduced, including inherited entity
        rows. `unavailable` lists the choices that would break the loop rules
        (duplicates are not included — filter those from the lists).
      responses:
        '200':
          description: Introductions
          content:
            application/json:
              schema:
                type: object
                properties:
                  introducedBy: { type: array, items: { $ref: '#/components/schemas/Introduction' } }
                  introduced: { type: array, items: { $ref: '#/components/schemas/Introduction' } }
                  unavailable:
                    type: object
                    properties:
                      introducerAccountIds: { type: array, items: { type: integer }, description: Accounts that can't be added as introducers of this account }
                      introducedAccountIds: { type: array, items: { type: integer }, description: Accounts this account can't be credited with introducing }
                      introducedEntityIds: { type: array, items: { type: integer }, description: Entities this account can't be credited with introducing }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/introductions:
    post:
      tags: [Introductions]
      summary: Record an introduction (admin-only)
      description: |
        Exactly one of `introducedAccountId` / `introducedEntityId` is
        required. Introducing an account also credits the introducer for
        every entity that account manages. Directly crediting an entity that
        was only inherited turns the inherited row into a direct one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [introducerAccountId]
              properties:
                introducerAccountId: { type: integer }
                introducedAccountId: { type: integer }
                introducedEntityId: { type: integer }
                date: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Introduction' } } } }
        '400': { description: 'Validation error, self-introduction, or the introduction would create a loop', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Introducer, introduced account or entity not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: The introduction already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/introductions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Introductions]
      summary: Edit an introduction's date and notes (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Introduction' } } } }
        '400': { description: 'Validation error, or the introduction is inherited', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Introductions]
      summary: Remove an introduction (admin-only)
      description: Removing an account introduction also removes the entity credit inherited through it.
      responses:
        '200': { description: Removed }
        '400': { description: The introduction is inherited — remove the managing account's introduction instead, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/accounts/{id}/delegations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Delegations]
      summary: An account's delegations (admin-only)
      responses:
        '200':
          description: Delegations on both sides of the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegatedIn: { type: array, items: { $ref: '#/components/schemas/Delegation' }, description: Accounts and entities that delegated to this one (it acts on their behalf) }
                  delegatedOut: { type: array, items: { $ref: '#/components/schemas/Delegation' }, description: Accounts this one delegated to (they act on its behalf) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/delegations:
    post:
      tags: [Delegations]
      summary: Delegate an account's or entity's access to an account
      description: Admins only for an account principal; admins or the entity's managers for an entity principal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegateAccountId, level]
              description: Exactly one of `principalAccountId` / `principalEntityId`.
              properties:
                principalAccountId: { type: integer, description: The account whose data is shared }
                principalEntityId: { type: integer, description: The entity whose data is shared }
                delegateAccountId: { type: integer, description: The account that acts on its behalf }
                level: { type: string, enum: [observer, manager] }
                notes: { type: string, maxLength: 2000, description: 'e.g. the power of attorney it rests on' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Delegation' } } } }
        '400': { description: 'Validation error, both or neither principal, or an account delegating to itself', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Principal account or entity, or delegate account, not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: The principal already delegates to that account, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/delegations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Delegations]
      summary: Change a delegation's level or notes
      description: Same permissions as creating it. Making an entity's last manager an observer answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level: { type: string, enum: [observer, manager] }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Delegation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: It is the entity's last manager, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Delegations]
      summary: Remove a delegation
      description: Same permissions as creating it. Removing an entity's last manager answers 409.
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: It is the entity's last manager, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/accounts/{id}/relationships:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Relationships]
      summary: An account's relationships, on either side (admin-only)
      responses:
        '200': { description: Relationships, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Relationship' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/relationships:
    post:
      tags: [Relationships]
      summary: Record a relationship between two accounts (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, toAccountId, description]
              properties:
                fromAccountId: { type: integer }
                toAccountId: { type: integer }
                description: { type: string, minLength: 1, maxLength: 100, example: wife, description: 'Trimmed. Reads "<from> is the <description> of <to>"' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '400': { description: 'Validation error, empty description, or both sides the same account', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Account not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: The same from → to relationship already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/relationships/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Relationships]
      summary: Change a relationship's description (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Relationships]
      summary: Remove a relationship (admin-only)
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/promoters:
    get:
      tags: [Promoters]
      summary: List promoters (admin-only)
      responses:
        '200': { description: Promoters, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Promoter' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Promoters]
      summary: Make an account a promoter (admin-only)
      description: |
        Optionally creates its incentives in the same call (each type at most
        once). New promoters are always inactive (an `active` field is
        ignored); they become active once their promoter agreement is signed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: integer }
                contractDate: { type: string, format: date, nullable: true, description: When the contract was signed }
                notes: { type: string, maxLength: 2000 }
                incentives: { type: array, items: { $ref: '#/components/schemas/PromoterIncentiveCreate' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Promoter' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Account not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: The account is already a promoter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/promoters/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Promoters]
      summary: Get a promoter (admin-only)
      responses:
        '200': { description: Promoter, content: { application/json: { schema: { $ref: '#/components/schemas/Promoter' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Promoters]
      summary: Update a promoter's status, contract date and notes (admin-only)
      description: |
        A promoter can be deactivated at any time, but only (re)activated when
        it has a signed promoter agreement (`hasSignedContract`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                contractDate: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Promoter' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Activating a promoter without a signed promoter agreement, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Promoters]
      summary: Remove a promoter and its incentives (admin-only)
      description: The account and its introductions are kept.
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/promoters/{id}/incentives:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Promoters]
      summary: Add an incentive to a promoter (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoterIncentiveCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PromoterIncentive' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Promoter not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: The promoter already has an incentive of that type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/promoters/{id}/incentives/{incentiveId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: incentiveId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Promoters]
      summary: Change an incentive's percent or notes (admin-only)
      description: The type can't be changed — remove the incentive and add one of the other type instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                percent: { oneOf: [{ type: number }, { type: string }], description: '0 < percent ≤ 100, at most 2 decimals' }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PromoterIncentive' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such incentive on this promoter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Promoters]
      summary: Remove an incentive (admin-only)
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such incentive on this promoter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/promoters/{id}/contracts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Contracts]
      summary: List a promoter's contracts, newest first (admin-only)
      responses:
        '200': { description: Contracts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contract' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Contracts]
      summary: Send a promoter agreement for signature through Concord (admin-only)
      description: |
        Creates the agreement from the promoter agreement template set in
        Concord settings (filed in the promoter agreement folder when set),
        reserves the template's signature slots for `signers` in order,
        starts the signature and emails every signer except our own signer
        (the Concord settings' `signerEmail`, or the calling admin) an invitation with
        `subject` (or `title` when empty) as subject and `message` as body. Start from
        `GET /api/promoters/{id}/contracts/draft`. If any step after creation
        fails, the half-made agreement is deleted in Concord.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, signers]
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
                signers: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: email }, description: 'One per template signature slot, in order; no duplicates' }
                variables: { type: object, additionalProperties: { type: string, maxLength: 2000 }, description: Template placeholders → values }
                subject: { type: string, maxLength: 255, description: Invitation email subject; defaults to `title` }
                message: { type: string, maxLength: 5000 }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Concord refused a step (message says which), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Concord credentials or the promoter template aren't configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/promoters/{id}/contracts/draft:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Contracts]
      summary: Suggested promoter agreement to review before sending (admin-only)
      description: |
        Prefilled from the promoter's account and incentives. The title and
        variables are always in English (the Concord template is English);
        the invitation `subject` and `message` are in the promoter's language. Variables: `Beneficiary`, `Nationality` (the account's
        `nationality`),
        `Address Street`, `Address State`, `Address Country`, `Email`, and
        `Detail of Fees` (every incentive, management fee first, joined with
        `"; "`, in capitals, e.g. `"20% OF THE MANAGEMENT FEE; 10% OF THE SUCCESS FEE"`).
        Signers: the promoter, then our own signer (the Managing Partner).
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/ContractDraft' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/contracts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Contracts]
      summary: Get a contract (admin-only)
      description: Returns the cached status; use `POST /api/contracts/{id}/refresh` to read it from Concord.
      responses:
        '200': { description: Contract, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contracts]
      summary: Cancel and delete a contract in Concord (admin-only)
      description: |
        Checks the live status first: signed contracts can't be deleted (409,
        and the cached status is updated). Otherwise pending signatures are
        cancelled and the agreement is trashed and deleted in Concord, then
        the record is removed. A contract Concord no longer has is just
        removed.
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The contract is signed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: Concord refused a step; the record is kept, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Concord isn't configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/contracts/{id}/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Contracts]
      summary: Read a contract's status from Concord (admin-only)
      description: |
        Updates `status` and `statusCheckedAt`, follows the signed copy's uid,
        sets `signedAt` the first time the contract is seen signed, and marks
        it `DELETED` if Concord no longer has it. When a promoter agreement
        is first seen signed (by all parties), the promoter becomes active
        and, if it has no `contractDate`, that is set to today. Later checks
        of the same signed contract don't reactivate a promoter an admin has
        deactivated.
      responses:
        '200': { description: Updated contract, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Concord refused the request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Concord isn't configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/roles:
    get:
      tags: [Accounts]
      summary: List role definitions
      security: []
      responses:
        '200':
          description: All roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }

  # ──── Organizations ───────────────────────────────────────────────────────
  /api/organizations:
    get:
      tags: [Organizations]
      summary: List organizations visible to the caller
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
    post:
      tags: [Organizations]
      summary: Create an organization (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }, description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Organizations]
      summary: Get a single organization
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }, description: Organization }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      summary: Update organization settings (admin or organizer)
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }, description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Organizations]
      summary: Delete an organization (admin-only)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/organizations/by-slug/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Organizations]
      summary: Public organization data by slug (no auth)
      security: []
      responses:
        '200':
          description: Public org info (no organizers list)
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/organizations/{id}/organizers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Organizations]
      summary: Add an organizer to an organization
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties: { accountId: { type: integer } }
      responses:
        '201': { description: Added }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}/organizers/{accountId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Organizations]
      summary: Remove an organizer
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──── Organization Members ────────────────────────────────────────────────
  /api/organizations/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Organization Members]
      summary: List organization members
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200':
          description: Members with account info
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}/members/request:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Organization Members]
      summary: Request membership for yourself, or add another account (admin/organizer)
      description: |
        Requires authentication (session or bearer token).

        - **No `accountId`** (or the caller's own id): creates a **pending**
          membership request for the logged-in account. Any user can do this.
        - **Another account's `accountId`**: only an admin, or an organizer of
          this organization, may do this (403 otherwise). The membership is
          created already **approved**. If that account already has a pending
          or rejected request, it is approved.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: integer
                  description: Account to add. Omit to request membership for yourself.
      responses:
        '200': { description: Existing membership returned (approved if a manager added a pending/rejected one) }
        '201': { description: Membership created — pending for self-requests, approved when added by an admin/organizer }
        '400': { description: Invalid organization ID or accountId }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Organization or account not found }

  /api/organizations/{id}/members/{accountId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Organization Members]
      summary: Approve / reject a membership, and set the member's default fees
      description: |
        Admin, or an organizer of this organization. Approved membership alone
        is not enough (403). Send `status` and/or the member's default fees —
        at least one.

        The default fees apply to the member's new investments in this
        organization's Vehicles (and to those of entities they manage) when
        the investment doesn't state its own; see `POST /api/vehicles/{id}/members`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [approved, rejected], description: "Server only accepts approved or rejected (pending is the initial state set by the request endpoint)." }
                managementFeePercent: { oneOf: [{ type: number }, { type: string }], nullable: true, description: "Default management fee, 0–100 (% of the commitment). null clears it." }
                successFeePercent: { oneOf: [{ type: number }, { type: string }], nullable: true, description: "Default success fee (carry), 0–100. null clears it." }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { description: 'Invalid status or fee, or nothing to update' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Organization Members]
      summary: Remove a member from an organization
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──── Organization Invites ────────────────────────────────────────────────
  /api/organizations/{id}/invites:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Organization Invites]
      summary: List invites (with used-by info)
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200':
          description: Invites
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization Invites]
      summary: Generate a new single-use invite link
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } }, description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}/invites/{inviteId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: inviteId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Organization Invites]
      summary: Delete an invite
      description: |
        Admin, or an organizer of this organization. Approved membership alone
        is not enough (403). The link stops working at once (`/api/invites/{token}`
        returns 404). Memberships already created through it are kept.
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid ID }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invites/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Organization Invites]
      summary: Validate an invite token (public)
      security: []
      responses:
        '200': { description: Returns the org info for the invite }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Invite already used }

  /api/invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [Organization Invites]
      summary: Accept an invite (public, auto-approves membership)
      description: |
        Two ways to accept:
        - **New user** (no auth needed): send `email`, `password`, `firstName`,
          `lastName` — a new account is created and joins the organization.
        - **Existing user**: call while authenticated (session or bearer token)
          with an empty body — the invite is accepted for the caller's account.

        A client-supplied `accountId` is ignored.

        A new account gets a welcome email (username, the organization joined
        and a sign-in link; never the password) in its `language`. A failed
        send doesn't undo the sign-up — see `welcomeEmail` in the response.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Empty body — accept for the authenticated caller.
                - type: object
                  required: [email, password, firstName, lastName]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string }
                    firstName: { type: string }
                    lastName: { type: string }
                    language:
                      type: string
                      enum: [en, es, fr]
                      default: en
                      description: The new account's language (also used for the welcome email). Unknown values fall back to `en`.
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { type: object, description: The organization membership (approved) }
                  message: { type: string }
                  welcomeEmail:
                    type: string
                    enum: [sent, failed]
                    description: Only when a new account was created — whether its welcome email went out.
        '400': { description: Not authenticated and no new account details supplied }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Email already registered (sign in instead) }
        '410': { description: Invite already used }

  # ──── Vehicles ────────────────────────────────────────────────────────────────
  /api/vehicles:
    get:
      tags: [Vehicles]
      summary: List all Vehicles visible to the caller
      responses:
        '200':
          description: Vehicles (with org info)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Vehicle' } } } }

  /api/organizations/{id}/vehicles:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicles]
      summary: List Vehicles for an organization
      description: Admin sees all Vehicles in the org. Non-admin members of the org see only the Vehicles they invest in (directly or through entities they own).
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Vehicle' } } } }, description: Vehicles }
    post:
      tags: [Vehicles]
      summary: Create a Vehicle under an organization
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VehicleCreate' } } }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Vehicle' } } }, description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/vehicles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicles]
      responses: { '200': { description: Vehicle, content: { application/json: { schema: { $ref: '#/components/schemas/Vehicle' } } } } }
      summary: Get a single Vehicle
    patch:
      tags: [Vehicles]
      summary: Update a Vehicle (admins and organizers of its organization)
      description: Investing in a Vehicle only grants read access; investors get 403.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VehicleCreate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Vehicle' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Vehicles]
      summary: Delete a Vehicle (admin-only)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/vehicles/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicles]
      summary: List Vehicle members (investors), one row per tranche
      description: Admins and organizers of the Vehicle's organization see every member row. Non-admin investors see only their own tranches (rows where the investor is their own account or an entity they own or manage), plus those of the accounts that delegated to them (see [Delegations](#tag/Delegations)). Non-investor non-admins receive 403.
      responses:
        '200':
          description: Each row has investorType + either an account or entity block. The same investor may appear in multiple rows (tranches), each with its own values. For non-admin investors, the response is filtered to only their own rows.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VehicleMember' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Add an investor position / tranche (account OR entity, never both). Calling multiple times for the same investor creates additional tranches.
      description: |
        **Default fees.** When `managementFee` or `carry` is omitted (or
        empty), it comes from the investor's default fees in the Vehicle's
        organization: `managementFee` = `committed` × the member's
        `managementFeePercent`, `carry` = their `successFeePercent`. An
        entity investor takes the lowest of its managers' defaults in the
        organization, fee by fee; with no default, the fee stays 0. Sending a
        value — even 0 — overrides the default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: integer, nullable: true }
                entityId: { type: integer, nullable: true }
                classId: { type: integer, description: "The share class this position goes into (one of the Vehicle's). Required when the Vehicle has several classes; defaults to its only class otherwise." }
                date: { type: string, format: date, nullable: true, description: "Investment date." }
                committed: { type: string, description: "Total commitment (gross)." }
                managementFee: { type: string, description: "Management fee charged on this position (an amount). Defaults from the investor's managementFeePercent." }
                otherFee: { type: string, description: "Any other fee charged on this position." }
                carry: { type: string, description: "Carry / Success Fee percentage (0-100) for this position. Stored per tranche; informational only — not subtracted from capital. Defaults from the investor's successFeePercent." }
                totalCalled: { type: string, description: "Capital actually called from the investor so far." }
                distributed: { type: string, description: "Distributions paid back to the investor." }
                ownershipPercent: { type: string, nullable: true, description: "Explicit ownership % (0–100). Only meaningful when the Vehicle's allocationMethod is 'Custom'." }
      responses:
        '201': { description: Added }
        '400': { description: "Invalid fields; a missing or foreign `classId` (see above); or AutoDeploy is on and the position's pool (its class, or the Vehicle) has no default asset.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/vehicles/{id}/members/{memberId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: memberId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Vehicles]
      summary: Update investment fields for a specific tranche
      description: Takes the same investment fields as POST. `classId` moves the position to another share class of the Vehicle; omitted, it stays in its class. Moving doesn't move capital already deployed into the old class's assets.
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Vehicles]
      summary: Remove a specific tranche from a Vehicle
      responses: { '200': { description: Removed } }

  /api/vehicles/{id}/classes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicles]
      summary: List the Vehicle's share classes with each pool's figures
      description: Admins and organizers of the Vehicle's organization see every class; investors see the classes they hold positions in; others receive 403.
      responses:
        '200': { description: Share classes by name, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VehicleClass' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Create a share class. Admin or organizer only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleClassInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleClass' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Vehicle not found }
        '409': { description: Another class of the Vehicle has that name (case-insensitive) }

  /api/vehicles/{id}/classes/{classId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: classId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Vehicles]
      summary: Rename a share class or change its notes. Admin or organizer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                notes: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleClass' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not a share class of this Vehicle }
        '409': { description: Another class of the Vehicle has that name }
    delete:
      tags: [Vehicles]
      summary: Delete a share class. Admin or organizer only.
      description: Refused (409) while the class holds positions or assets — move or remove them first — and for the Vehicle's last class (a Vehicle always has at least one).
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not a share class of this Vehicle }
        '409': { description: "The class still holds positions or assets, or is the Vehicle's last" }

  # ──── Entities ────────────────────────────────────────────────────────────
  /api/vehicles/{id}/assets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicles]
      summary: List the Vehicle's assets (financial instruments)
      description: Admins and organizers of the Vehicle's organization see every asset. Investors see the assets of the share classes they hold positions in (every asset when the Vehicle has no classes); others receive 403.
      responses:
        '200': { description: Assets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VehicleAsset' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Add an asset to the Vehicle. Requires admin or organization organizer. Cost may exceed current `vehicle.cash` (cash will simply go negative).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName: { type: string }
                instrumentType: { type: string, example: "Equity" }
                purchaseDate: { type: string, format: date, nullable: true }
                cost: { type: string, description: "Initial cost. May exceed current Vehicle cash (cash will go negative)." }
                notes: { type: string }
                classId: { type: integer, description: "The share class holding this asset. Same rules as for positions: required with several classes, defaults to the only one." }
                isDefault: { type: boolean, description: "Mark this asset as its class's default. Auto-clears the flag on any other asset in the same class." }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/vehicles/{id}/assets/{assetId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: assetId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Vehicles]
      summary: Update an asset's fields. Admin or organizer only.
      description: Takes the same fields as POST. `classId` moves the asset to another share class; a default asset moved this way stops being the default unless `isDefault` is true (then it replaces the new class's default).
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Vehicles]
      summary: Delete an asset (cascades valuations). Admin or organizer only.
      responses: { '200': { description: Deleted } }

  /api/vehicles/{id}/assets/{assetId}/valuations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: assetId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicles]
      summary: List the asset's valuation history (newest first).
      description: Same access as listing the Vehicle's assets — investors get 403 for an asset of a share class they don't hold positions in.
      responses:
        '200': { description: Valuations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VehicleAssetValuation' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Add a new valuation (mark) for the asset. Admin or organizer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, value]
              properties:
                date: { type: string, format: date }
                value: { type: string }
                note: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VehicleAssetValuation' } } } }

  /api/vehicles/{id}/assets/{assetId}/valuations/{valuationId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: assetId, in: path, required: true, schema: { type: integer } }
      - { name: valuationId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Vehicles]
      summary: Delete a valuation. Admin or organizer only.
      responses: { '200': { description: Deleted } }

  /api/entities:
    get:
      tags: [Entities]
      summary: List entities visible to the caller
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Entity' } } } }, description: Entities }
    post:
      tags: [Entities]
      summary: Create an entity with its managers
      description: |
        An entity can't act by itself, so `managerAccountIds` (at least one)
        become its `manager`-level delegates. Non-admins must include
        themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EntityCreate'
                - type: object
                  required: [managerAccountIds]
                  properties:
                    managerAccountIds: { type: array, minItems: 1, items: { type: integer } }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } }, description: Created }
        '400': { description: 'Validation error, no managers, or a non-admin not among them', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: A manager account doesn't exist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/entities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities]
      summary: Get a single entity
      description: Admins, and accounts that are delegates of the entity — themselves or through an account that delegated to them.
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Entity'
                  - type: object
                    required: [access]
                    properties:
                      access: { type: string, enum: [admin, observer, manager], description: How the caller reaches this entity }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Entities]
      summary: Update an entity (admins and its managers)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityCreate' } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } } }
    delete:
      tags: [Entities]
      summary: Delete an entity (admin-only) — cascades owners and delegations
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/entities/{id}/owners:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities]
      summary: List entity owners (accounts and/or other entities)
      responses: { '200': { description: Owners } }
    post:
      tags: [Entities]
      summary: Add an owner (account or another entity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerType, ownershipPercent]
              properties:
                ownerType: { type: string, enum: [account, entity] }
                ownerAccountId: { type: integer, nullable: true }
                ownerEntityId: { type: integer, nullable: true }
                ownershipPercent: { type: string }
      responses: { '201': { description: Added } }

  /api/entities/{id}/owners/{ownerId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: ownerId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Entities]
      summary: Remove an owner
      responses: { '200': { description: Removed } }

  /api/entities/{id}/introductions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Introductions]
      summary: Who introduced an entity, including inherited credit (admin-only)
      responses:
        '200': { description: Introductions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Introduction' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/entities/{id}/delegations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities, Delegations]
      summary: Accounts acting for the entity
      description: |
        Anyone who can read the entity. Change them through `/api/delegations`
        with `principalEntityId`. Replaces the former `/api/entities/{id}/managers`
        endpoints — managers are the `manager`-level rows.
      responses:
        '200': { description: Delegations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Delegation' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──── Documents ───────────────────────────────────────────────────────────
  /api/documents:
    get:
      tags: [Documents]
      summary: List documents visible to the caller
      description: |
        Admins see every document. Non-admins see documents owned by their
        own account, plus documents owned by entities they own (recursively,
        via `entity_owners`) or are delegates of — and the same
        for every account that delegated to them (see [Delegations](#tag/Delegations)).
      responses:
        '200':
          description: Documents (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Documents]
      summary: Upload a document (admin-only, multipart)
      description: |
        Multipart upload, max 100 MB. Each document must be associated with
        **exactly one** owner — provide either `accountId` (when
        `ownerType=account`) or `entityId` (when `ownerType=entity`).

        `folderPath` is a virtual path made of `/`-separated segments
        (e.g. `"Vehicles/RS Kushki"`). Segments are sanitized server-side
        (illegal chars become `_`, `..` is stripped).

        On disk the file is written under
        `<storage_path>/{account|entity}/<id>/<folderPath>/<original-name>-<timestamp>-<rand>.<ext>`,
        so an entity's documents never collide with an account's.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ownerType]
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary contents (≤ 100 MB).
                name:
                  type: string
                  description: Display name. Defaults to the uploaded file's original name.
                folderPath:
                  type: string
                  example: "Vehicles/RS Kushki"
                  description: Virtual folder path; `/`-separated. Empty = root.
                ownerType:
                  type: string
                  enum: [account, entity]
                accountId:
                  type: integer
                  description: Required when `ownerType=account`.
                entityId:
                  type: integer
                  description: Required when `ownerType=entity`.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/documents/{id}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Documents]
      summary: Stream the file's binary contents
      description: |
        Visibility-filtered using the same rules as `GET /api/documents`.
        Returns `Content-Disposition: attachment` with the original filename.
        Returns `410 Gone` if the DB row exists but the file is missing on disk.
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: File missing on disk (DB row still present)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Documents]
      summary: Delete a document (admin-only)
      description: Removes the database row **and** the file on disk.
      responses:
        '200': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──── Settings ────────────────────────────────────────────────────────────
  /api/settings/documents-path:
    get:
      tags: [Settings]
      summary: Get the document storage path (admin-only)
      description: |
        Returns the `configured` value (empty string if unset), the
        `effective` absolute path actually used (resolved from configured or
        the default), and the `default` path.
      responses:
        '200':
          description: Storage path info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentsPathSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Settings]
      summary: Set the document storage path (admin-only)
      description: |
        Pass an absolute or relative filesystem path in `value`. Empty string
        falls back to the default (`./uploads/documents`). The path is
        created on demand. Existing files are not migrated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: Filesystem path; empty string = default.
      responses:
        '200':
          description: Updated path info
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: string }
                  effective: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/settings/concord:
    get:
      tags: [Settings]
      summary: Get the Concord e-signature settings (admin-only)
      description: |
        Stored Concord settings (empty string = unset), whether the
        `CONCORD_API_KEY` env var is set (the key itself is never returned),
        and the default URLs used when the overrides are empty.
      responses:
        '200':
          description: Concord settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConcordSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Settings]
      summary: Update the Concord e-signature settings (admin-only)
      description: |
        Only the fields sent are changed; values are trimmed and an empty
        string clears a field (URLs fall back to the defaults). Unknown
        fields — including an API key — are rejected: the key only comes from
        the `CONCORD_API_KEY` env var.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                orgId: { type: string, maxLength: 100, description: Concord organization id (required for contracts) }
                apiUrl: { type: string, description: REST base override; http(s) URL or empty }
                appUrl: { type: string, description: Web-app link base override; http(s) URL or empty }
                signerEmail: { type: string, description: "Our side's signer (a member of the Concord org); email or empty for the admin sending the contract" }
                promoterTemplateId: { type: string, maxLength: 100, description: Concord template uid for promoter agreements }
                promoterFolderId: { type: string, maxLength: 100, description: Optional Concord folder for promoter agreements }
      responses:
        '200':
          description: Updated Concord settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConcordSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──── Currencies ──────────────────────────────────────────────────────────
  /api/currencies:
    get:
      tags: [Currencies]
      summary: List the currency catalog
      description: |
        Returns every known currency (active and inactive). `active`
        currencies are the ones selectable as a Vehicle's currency on creation
        and offered in the dashboard's "view in" dropdown.
      responses:
        '200':
          description: Currency catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Currency' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/currencies/{code}:
    patch:
      tags: [Currencies]
      summary: Activate or deactivate a currency (admin-only)
      description: |
        USD is the platform's base reporting currency and the exchange-rate
        pivot — it can never be deactivated. Activating a currency triggers
        an immediate best-effort exchange-rate fetch rather than waiting for
        the next scheduled refresh.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: EUR }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Updated currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Currency' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exchange-rates:
    get:
      tags: [Currencies]
      summary: Latest known exchange rates
      description: |
        Rates are expressed as "USD per 1 unit of the currency" (USD itself
        is always 1) and refreshed at most once a day from a public FX feed.
        No history is kept — only the latest rate per currency.
      responses:
        '200':
          description: Exchange rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/exchange-rates/refresh:
    post:
      tags: [Currencies]
      summary: Force an immediate exchange-rate refresh (admin-only)
      description: Mainly for troubleshooting a stale or missing rate; the daily refresh otherwise runs automatically.
      responses:
        '200':
          description: Refreshed exchange rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──── Portfolio ───────────────────────────────────────────────────────────
  /api/portfolio:
    get:
      tags: [Portfolio]
      summary: Investment positions (admin sees all; non-admin sees own)
      description: |
        Optional filters:
        - `?accountId=<id>` — investments owned directly by the account *plus*
          investments held by entities the account owns (recursively, via
          `entity_owners`). Non-admins may only request their own accountId or one that
          delegated to them (see [Delegations](#tag/Delegations)).
        - `?entityId=<id>` — investments held directly by that entity.
          Non-admins must own or manage the entity, themselves or through an
          account that delegated to them.
      parameters:
        - { name: accountId, in: query, schema: { type: integer } }
        - { name: entityId, in: query, schema: { type: integer } }
      responses:
        '200': { description: "Portfolio positions. Each carries `classId` / `className` — the share class it's in — `vehicleClassCount` (show the class only when > 1), and its `currentValue` within that class's pool." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ──────────────────────────────────────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Set automatically by `POST /api/auth/login`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ff_<48 hex chars>
      description: |
        Personal API token created via `POST /api/auth/tokens` (admin-only).
        Tokens inherit the owner's roles.

  responses:
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication required or rejected
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but lacks permission
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: admin }
        description: { type: string, nullable: true }

    Account:
      type: object
      description: User account. `passwordHash` is NEVER included in API responses.
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        middleName: { type: string, nullable: true, description: Optional middle name. Included in the full legal name on contracts }
        nationality: { type: string, description: Country of citizenship (country name; empty if unknown). Used for contracts }
        mailingStreetAddress1: { type: string, nullable: true, description: Optional mailing address, when it differs from the residential one (empty = same) }
        mailingStreetAddress2: { type: string, nullable: true }
        mailingCity: { type: string, nullable: true }
        mailingStateProvince: { type: string, nullable: true }
        mailingZipPostalCode: { type: string, nullable: true }
        mailingCountry: { type: string, nullable: true, description: Country name }
        profileComplete: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    AccountCreate:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 1
          description: |
            Optional. Omit it to have the welcome email send the user a link to
            create their own password instead (requires `welcome_email` to be true).
        firstName: { type: string }
        lastName: { type: string }
        middleName: { type: string, nullable: true, description: Optional middle name. Included in the full legal name on contracts }
        nationality: { type: string, description: Country of citizenship (country name; empty if unknown). Used for contracts }
        mailingStreetAddress1: { type: string, nullable: true, description: Optional mailing address, when it differs from the residential one (empty = same) }
        mailingStreetAddress2: { type: string, nullable: true }
        mailingCity: { type: string, nullable: true }
        mailingStateProvince: { type: string, nullable: true }
        mailingZipPostalCode: { type: string, nullable: true }
        mailingCountry: { type: string, nullable: true, description: Country name }
        roles:
          type: array
          items: { type: string }
          example: [admin]
          description: Role names to assign (e.g. `admin`). Unknown names are ignored. Defaults to no roles.
        welcome_email:
          type: boolean
          default: true
          description: |
            Send the new user a welcome email in the account's `language`.
            With a `password`, it contains the login email, password and a
            sign-in link; without one, it contains the login email and a link to
            create a password. Defaults to true; pass `false` to skip it (only
            allowed when a `password` is provided).

    AccountUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        middleName: { type: string, nullable: true, description: Optional middle name. Included in the full legal name on contracts }
        nationality: { type: string, description: Country of citizenship (country name; empty if unknown). Used for contracts }
        mailingStreetAddress1: { type: string, nullable: true, description: Optional mailing address, when it differs from the residential one (empty = same) }
        mailingStreetAddress2: { type: string, nullable: true }
        mailingCity: { type: string, nullable: true }
        mailingStateProvince: { type: string, nullable: true }
        mailingZipPostalCode: { type: string, nullable: true }
        mailingCountry: { type: string, nullable: true, description: Country name }
        roles:
          type: array
          items: { type: string }
          example: [admin]
          description: |
            Role names (e.g. `admin`). Replaces the account's role assignments
            wholesale — send `[]` to remove all roles. Unknown names are ignored.
            Admin only: for non-admin callers this field is silently stripped
            (the rest of the update still applies).
        password:
          type: string
          minLength: 6
          description: Admin only. Directly sets a new password for the account.
        welcome_email:
          type: boolean
          default: false
          description: |
            Only used together with `password`. When true, emails the user their
            login email and the new password (in the account's `language`).

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string, description: URL-friendly slug for the public landing page }
        description: { type: string, nullable: true }
        website: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateProvince: { type: string, nullable: true }
        organizers:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        website: { type: string }
        country: { type: string }
        city: { type: string }
        stateProvince: { type: string }

    Member:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        accountId: { type: integer }
        status: { type: string, enum: [pending, approved, rejected] }
        inviteId: { type: integer, nullable: true }
        managementFeePercent: { type: string, nullable: true, example: "5.00", description: Default management fee (% of the commitment) for the member's investments in this organization }
        successFeePercent: { type: string, nullable: true, example: "20.00", description: Default success fee (carry %) for the member's investments in this organization }
        account: { $ref: '#/components/schemas/Account' }

    Invite:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        token: { type: string, description: Use in /org/:slug?invite=TOKEN }
        used: { type: boolean }
        usedByAccountId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    Vehicle:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        organizationName: { type: string }
        legalName: { type: string }
        displayName: { type: string }
        entityType: { type: string }
        currency: { type: string, example: "USD", description: "ISO 4217 code. Set once at creation (see VehicleCreate) and immutable afterward — every investment into the Vehicle is denominated in it. PATCH /api/vehicles/:id silently ignores this field." }
        allocationMethod: { type: string }
        managementFeePercent: { type: string }
        carriedInterestPercent: { type: string }
        preferredReturnPercent: { type: string }
        totalBeingRaised: { type: string }
        minimumInvestment: { type: string }
        cash: { type: string, description: "DERIVED. = sum(member.totalCalled) − sum(asset.cost) — the sum over its share classes. Returned, never stored." }
        assetValue: { type: string, description: "DERIVED. = sum(asset.currentValue) where asset.currentValue is its latest valuation (or cost if none)." }
        currentValue: { type: string, description: "DERIVED. = cash + assetValue." }
        classCount: { type: integer, description: "Number of share classes, at least 1. Classes are only shown when there are several. See GET /api/vehicles/{id}/classes." }
        autoDeploy: { type: boolean, description: "When true, every new investment added to the Vehicle is auto-called for its NET capital (totalCalled = committed − managementFee − otherFee) and that net amount is added to the default asset's cost (at original cost, not current value). Fees stay on the member as fees and are not deployed. Requires a default asset; otherwise POST /members returns 400." }
        members:
          type: array
          items: { $ref: '#/components/schemas/VehicleMember' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VehicleAsset:
      type: object
      description: A financial instrument owned by a Vehicle.
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        classId: { type: integer, description: "The share class holding it." }
        companyName: { type: string }
        instrumentType: { type: string, example: "Equity", description: "Equity, Convertible Note, SAFE, Preferred Stock, Common Stock, Warrant, Debt, Other." }
        purchaseDate: { type: string, format: date, nullable: true }
        cost: { type: string, description: "Initial cost paid from Vehicle cash." }
        notes: { type: string }
        isDefault: { type: boolean, description: "At most one asset per share class can be the default. It receives the AutoDeploy capital of that class's new positions." }
        currentValue: { type: string, description: "DERIVED. = latest VehicleAssetValuation.value (by date), or cost when no valuations exist." }

    VehicleAssetValuation:
      type: object
      properties:
        id: { type: integer }
        assetId: { type: integer }
        date: { type: string, format: date }
        value: { type: string }
        note: { type: string }

    VehicleClassInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100, example: "Class A", description: "Unique within the Vehicle (case-insensitive)." }
        notes: { type: string }

    VehicleClass:
      type: object
      description: A share class of a Vehicle — a segregated pool of positions and assets. Figures are DERIVED from the class's own positions and assets.
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        name: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer, description: "Positions (tranches) in the class." }
        assetCount: { type: integer }
        committed: { type: string }
        totalCalled: { type: string }
        cash: { type: string, description: "= the class's totalCalled − its assets' cost." }
        assetValue: { type: string }
        currentValue: { type: string, description: "= cash + assetValue." }

    VehicleCreate:
      type: object
      required: [legalName, displayName, entityType]
      properties:
        legalName: { type: string }
        displayName: { type: string }
        entityType: { type: string, example: LLC }
        currency: { type: string, example: "USD", default: "USD", description: "ISO 4217 code; must be one of the platform's active currencies (GET /api/currencies). Defaults to USD. Cannot be changed after creation." }
        allocationMethod:
          type: string
          enum: ["By Commitment", "By Capital Invested", "Custom"]
          example: "By Commitment"
          description: |
            How ownership % is calculated, within each share class:
            - **By Commitment**: each investor's share = their `committed` divided by the class's total `committed`.
            - **By Capital Invested**: each investor's share = `capital` (= `committed` − `managementFee` − `otherFee`) divided by the total of `capital` across the class's members.
            - **Custom**: ownership is set explicitly per investor via `ownershipPercent`.
        managementFeePercent: { type: string }
        carriedInterestPercent: { type: string }
        preferredReturnPercent: { type: string }
        totalBeingRaised: { type: string }
        minimumInvestment: { type: string }

    VehicleMember:
      type: object
      description: One investor in a Vehicle — exactly one of account/entity is non-null.
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        classId: { type: integer, description: "The share class of this position." }
        className: { type: string }
        investorType: { type: string, enum: [account, entity] }
        date: { type: string, format: date, nullable: true }
        committed: { type: string, description: "Total commitment (gross)." }
        managementFee: { type: string }
        otherFee: { type: string }
        carry: { type: string, description: "Carry / Success Fee percentage (0-100) for this tranche. Informational only; not subtracted from capital." }
        totalCalled: { type: string, description: "Capital called from the investor so far." }
        distributed: { type: string, description: "Distributions paid back to the investor." }
        ownershipPercent: { type: string, nullable: true, description: "Explicit ownership % (0–100) used only when the Vehicle's allocationMethod is 'Custom'." }
        currentValue: { type: string, description: "DERIVED. = ownership share of its share class × the class's currentValue. Returned on responses; cannot be set." }
        # Derived (NOT stored, computed server-side):
        #   capital              = committed − (managementFee + otherFee)
        #   commitmentRemaining  = capital − totalCalled
        #   currentValue         = ownership% × pool currentValue
        account: { $ref: '#/components/schemas/Account', nullable: true }
        entity: { $ref: '#/components/schemas/Entity', nullable: true }

    Entity:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        entityType: { type: string, example: LLC }
        currency: { type: string }
        ownershipAllocation: { type: string, enum: [percent, shares] }
        disbursementMethod: { type: string }
        owners: { type: array, items: { type: object } }
        managers:
          type: array
          description: Its `manager`-level delegates
          items:
            type: object
            properties:
              id: { type: integer, description: The delegation id }
              accountId: { type: integer }
              account: { $ref: '#/components/schemas/AccountSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Introduction:
      type: object
      properties:
        id: { type: integer }
        introducerAccountId: { type: integer }
        introducedAccountId: { type: integer, nullable: true }
        introducedEntityId: { type: integer, nullable: true }
        viaAccountId:
          type: integer
          nullable: true
          description: Set on inherited entity introductions — the managing account the credit flows through.
        date: { type: string, format: date, nullable: true }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        introducer: { $ref: '#/components/schemas/AccountSummary' }
        introducedAccount: { $ref: '#/components/schemas/AccountSummary' }
        introducedEntity:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            entityType: { type: string }
        via: { $ref: '#/components/schemas/AccountSummary' }

    Delegation:
      type: object
      properties:
        id: { type: integer }
        principalAccountId: { type: integer, nullable: true }
        principalEntityId: { type: integer, nullable: true, description: Exactly one of principalAccountId / principalEntityId is set }
        delegateAccountId: { type: integer }
        level: { type: string, enum: [observer, manager] }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        principal: { $ref: '#/components/schemas/AccountSummary' }
        principalEntity:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            entityType: { type: string }
        delegate: { $ref: '#/components/schemas/AccountSummary' }

    Relationship:
      type: object
      description: '"<fromAccount> is the <description> of <toAccount>".'
      properties:
        id: { type: integer }
        fromAccountId: { type: integer }
        toAccountId: { type: integer }
        description: { type: string, example: wife }
        createdAt: { type: string, format: date-time }
        fromAccount: { $ref: '#/components/schemas/AccountSummary' }
        toAccount: { $ref: '#/components/schemas/AccountSummary' }

    AccountSummary:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }

    PromoterIncentiveCreate:
      type: object
      required: [type, percent]
      properties:
        type: { type: string, enum: [management_fee, success_fee] }
        percent: { oneOf: [{ type: number }, { type: string }], description: '0 < percent ≤ 100, at most 2 decimals' }
        notes: { type: string, maxLength: 2000 }

    PromoterIncentive:
      type: object
      properties:
        id: { type: integer }
        promoterId: { type: integer }
        type: { type: string, enum: [management_fee, success_fee] }
        percent: { type: string, example: '20.00' }
        notes: { type: string }
        createdAt: { type: string, format: date-time }

    Promoter:
      type: object
      properties:
        id: { type: integer }
        accountId: { type: integer }
        active: { type: boolean }
        contractDate: { type: string, format: date, nullable: true }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        account: { $ref: '#/components/schemas/AccountSummary' }
        incentives: { type: array, items: { $ref: '#/components/schemas/PromoterIncentive' } }
        introductionCount: { type: integer, description: Accounts and entities credited to the promoter, inherited entity credit included }
        hasSignedContract: { type: boolean, description: Whether a promoter agreement is signed; the promoter can only be active then }

    Contract:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [promoter_agreement] }
        concordUid: { type: string, description: Concord agreement uid (the signed copy's once signed) }
        title: { type: string }
        status: { type: string, description: 'Concord summary status as of statusCheckedAt: DRAFT, VALIDATION, NEGOTIATION, SIGNING, SIGNED, BROKEN (cancelled), or DELETED (gone from Concord)', example: SIGNING }
        signers: { type: array, items: { type: string, format: email } }
        promoterId: { type: integer, nullable: true }
        createdByAccountId: { type: integer, nullable: true }
        statusCheckedAt: { type: string, format: date-time, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true, description: When FundFlow first saw it signed }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        url: { type: string, nullable: true, description: Link to the document in Concord; null when Concord isn't configured }

    ContractDraft:
      type: object
      properties:
        ready: { type: boolean, description: Whether Concord and this kind's template are configured }
        title: { type: string }
        signers: { type: array, items: { type: string, format: email } }
        variables: { type: object, additionalProperties: { type: string } }
        subject: { type: string, description: "Invitation email subject, in the promoter's language" }
        message: { type: string, description: "Invitation email body, in the promoter's language" }

    EntityCreate:
      type: object
      required: [name, entityType]
      properties:
        name: { type: string }
        entityType: { type: string }
        currency: { type: string }
        ownershipAllocation: { type: string, enum: [percent, shares] }
        disbursementMethod: { type: string }

    Document:
      type: object
      description: |
        A file attached to either an Account or an Entity. Exactly one of
        `accountId` / `entityId` is non-null. The on-disk file lives at
        `<storage_path>/<storedPath>` — the API never exposes the absolute
        filesystem path; use `GET /api/documents/{id}/download` to fetch the
        contents.
      properties:
        id: { type: integer }
        name:
          type: string
          description: Display name. Defaults to the uploaded file's original name.
        folderPath:
          type: string
          description: Sanitized virtual folder path (slash-separated).
          example: "Vehicles/RS Kushki"
        ownerType: { type: string, enum: [account, entity] }
        accountId: { type: integer, nullable: true }
        entityId: { type: integer, nullable: true }
        fileName:
          type: string
          description: Original filename as uploaded by the client.
        storedPath:
          type: string
          description: Path under the storage root (server-internal; do not rely on its exact format).
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploadedBy: { type: integer, description: "Account id of the admin who uploaded the file." }
        owner:
          type: object
          nullable: true
          description: Resolved owner summary.
          properties:
            id: { type: integer }
            type: { type: string, enum: [account, entity] }
            name: { type: string }
        uploader:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        createdAt: { type: string, format: date-time }

    ConcordSettings:
      type: object
      properties:
        orgId: { type: string }
        apiUrl: { type: string, description: Empty = `defaultApiUrl` }
        appUrl: { type: string, description: Empty = `defaultAppUrl` }
        signerEmail: { type: string, description: Empty = the admin sending the contract }
        promoterTemplateId: { type: string }
        promoterFolderId: { type: string }
        apiKeySet: { type: boolean, description: Whether the CONCORD_API_KEY env var is set }
        defaultApiUrl: { type: string, example: "https://api.concordnow.com/api/rest/1" }
        defaultAppUrl: { type: string, example: "https://secure.concordnow.com/#" }

    DocumentsPathSettings:
      type: object
      properties:
        configured:
          type: string
          description: Raw value stored in `app_settings` (empty string if unset).
        effective:
          type: string
          description: Absolute path actually used (resolved from `configured` or `default`).
        default:
          type: string
          description: Default path used when `configured` is empty.

    Currency:
      type: object
      properties:
        code: { type: string, example: "EUR", description: "ISO 4217 code." }
        name: { type: string, example: "Euro" }
        symbol: { type: string, example: "€" }
        active: { type: boolean, description: "Whether this currency is selectable for new Vehicles and in the dashboard's currency dropdown. USD is always active." }

    ExchangeRates:
      type: object
      properties:
        base: { type: string, example: "USD", description: "Pivot currency — always USD." }
        rates:
          type: object
          additionalProperties: { type: number }
          example: { USD: 1, EUR: 1.0825 }
          description: "USD per 1 unit of each active currency's code (USD itself is always 1)."
        updatedAt: { type: string, format: date-time, nullable: true, description: "Most recent refresh timestamp across all stored rates; null if none have been fetched yet." }

    PublicApiToken:
      type: object
      description: API token metadata (the secret hash is NEVER included).
      properties:
        id: { type: integer }
        accountId: { type: integer }
        name: { type: string }
        prefix:
          type: string
          description: First 8 hex chars after `ff_` — safe to log for debugging.
          example: "a1b2c3d4"
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
