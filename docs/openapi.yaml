openapi: 3.1.0
info:
  title: FundFlow REST API
  version: "1.0.0"
  description: |
    Multi-tenant VC/PE fund management platform. Covers accounts, organizations,
    SPVs, entities, members, invites, portfolio data, and authentication.

    ## Authentication
    Two methods are accepted on every `/api/*` endpoint:

    1. **Session cookie** — set by `POST /api/auth/login`. Used by the web UI.
    2. **Bearer token** — `Authorization: Bearer ff_<48 hex chars>`. Generated
       via `POST /api/auth/tokens` (admin-only). Tokens inherit the owner's
       account roles, so an admin token can hit admin-only routes; a non-admin
       token only sees what its owner is allowed to see.

    Token CRUD itself (`/api/auth/tokens` routes) and `/api/auth/change-password`
    require a real session cookie — never a bearer token — so a leaked token
    cannot mint more tokens or lock the user out of their account.

    ## Permissions model
    - **admin** role: full access. Can create/delete organizations, delete any
      account/SPV/entity, and manage API tokens.
    - **non-admin**: scoped to data they participate in (org member/organizer,
      SPV member, entity manager/owner).
    - Permission checks happen identically for cookie- and token-authenticated
      requests.

  contact:
    name: FundFlow

servers:
  - url: /
    description: Same-origin (web app and API share a host)

tags:
  - name: Discovery
    description: API discovery — fetch this OpenAPI spec or browse the docs UI
  - name: Auth
    description: Login, logout, password management, and the current account
  - name: API Tokens
    description: Personal access tokens (admin-only)
  - name: Accounts
    description: User accounts and roles
  - name: Organizations
    description: Tenant organizations and their public landing pages
  - name: Organization Members
    description: Membership requests and approvals
  - name: Organization Invites
    description: Single-use invite tokens
  - name: SPVs
    description: Special Purpose Vehicles (investment funds) and their investors
  - name: Entities
    description: Legal entities (LLCs, Corps, Trusts) with owners and managers
  - name: Portfolio
    description: Investment positions held by accounts and entities
  - name: Documents
    description: |
      Files attached to either an Account or an Entity, organized in a
      user-defined folder tree. Visibility for non-admin callers is scoped to
      documents owned by their account, plus documents owned by entities they
      own (recursively, via `entity_owners`) or manage (via `entity_managers`).
      Upload, delete, and storage settings are admin-only.
  - name: Settings
    description: Platform-wide settings (admin-only)
  - name: Currencies
    description: |
      The platform's currency catalog and daily FX rates. SPVs are
      denominated in one of the *active* currencies (USD and EUR by
      default); the dashboard uses the rates here to consolidate
      multi-currency investments into a single selected display currency.
      Reading is open to any authenticated user; activating/deactivating a
      currency and forcing a refresh are admin-only.

# ──────────────────────────────────────────────────────────────────────────────
# Reusable security
# ──────────────────────────────────────────────────────────────────────────────
security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  # ──── Discovery (public) ──────────────────────────────────────────────────
  /api/openapi.json:
    get:
      tags: [Discovery]
      summary: This OpenAPI 3.1 spec as JSON
      description: |
        Public — no authentication required. Use this to bootstrap an API
        client (e.g. Postman import, openapi-generator, or an LLM agent's
        function-calling layer).
      security: []
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/json:
              schema: { type: object }

  /api/openapi.yaml:
    get:
      tags: [Discovery]
      summary: This OpenAPI 3.1 spec as YAML (source of truth)
      security: []
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/yaml:
              schema: { type: string }

  /docs:
    get:
      tags: [Discovery]
      summary: Human-readable API documentation (Redoc UI)
      security: []
      responses:
        '200':
          description: HTML page rendering the OpenAPI spec
          content:
            text/html:
              schema: { type: string }

  # ──── Auth ────────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated. Sets a session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the current session cookie
      security: []
      responses:
        '200': { description: Logged out (always 200 even if no session existed) }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently-authenticated account
      description: Works with both session cookies and bearer tokens.
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current account's password
      description: Session-only — cannot be called with a bearer token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                language:
                  type: string
                  enum: [en, es, fr]
                  description: Locale of the page the request was made from. The reset email is sent in this language; falls back to the account's saved language if omitted.
      responses:
        '200': { description: Always returns 200 (does not leak account existence) }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Consume a password reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ──── API Tokens (admin-only) ─────────────────────────────────────────────
  /api/auth/tokens:
    get:
      tags: [API Tokens]
      summary: List the caller's API tokens
      description: Admin-only. Session-only (bearer tokens cannot list tokens).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of tokens (no plaintext, no hashes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicApiToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [API Tokens]
      summary: Create a new API token
      description: |
        Admin-only. Session-only. The plaintext token is returned in the
        response under `token` and is **never retrievable again** — store it
        immediately.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, example: "CI pipeline" }
                expiresInDays:
                  type: integer
                  minimum: 1
                  description: If omitted, the token never expires.
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicApiToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        pattern: '^ff_[0-9a-f]{48}$'
                        description: Full plaintext token. Shown only once.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [API Tokens]
      summary: Revoke a token
      description: |
        Admin-only. Session-only. Scoped to caller's accountId — you cannot
        revoke another admin's tokens.
      security:
        - sessionCookie: []
      responses:
        '200': { description: Token revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Token not found or already revoked }

  # ──── Accounts ────────────────────────────────────────────────────────────
  /api/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: |
        Admins see all accounts (with optional `?search=` and `?role=` filters).
        Non-admins receive a single-element array containing their own account.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
      responses:
        '200':
          description: Accounts (passwordHash always stripped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
    post:
      tags: [Accounts]
      summary: Create a new account (admin only)
      description: |
        Admin only. There is no self-signup via the API — new users are created
        by an admin or join through an organization invite
        (`POST /api/invites/{token}/accept`).

        **Password is optional.** The welcome email (on by default) depends on it:
        - **With `password`** — the email contains the username and password.
        - **Without `password`** — the account cannot log in yet; the email
          contains the username and a link to create a password (valid 7 days,
          single use). If it expires, the user can use "Forgot your password?".

        Omitting `password` while sending `welcome_email: false` is rejected
        with 400, since the user would have no way to sign in.

        The response includes `welcomeEmail` so callers can tell whether the
        email actually went out. A failed send does not roll back the account
        (still 201) — follow up with a password reset or set a password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - type: object
                    required: [welcomeEmail]
                    properties:
                      welcomeEmail:
                        type: string
                        enum: [sent, failed, skipped]
                        description: |
                          `sent` — welcome email delivered to the SMTP server.
                          `failed` — sending failed; the account was still created.
                          `skipped` — `welcome_email: false` was sent.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Email already registered }

  /api/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Accounts]
      summary: Get a single account
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }, description: Account }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      summary: Update account fields and/or roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: |
            Updated. When `password` was set, the response also includes
            `welcomeEmail` (`sent`, `failed` or `skipped`); a failed send does
            not undo the password change.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - type: object
                    properties:
                      welcomeEmail:
                        type: string
                        enum: [sent, failed, skipped]
                        description: Present only when `password` was set.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Accounts]
      summary: Delete an account (admin-only)
      description: Cascades to account_roles and api_tokens.
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/roles:
    get:
      tags: [Accounts]
      summary: List role definitions
      security: []
      responses:
        '200':
          description: All roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }

  # ──── Organizations ───────────────────────────────────────────────────────
  /api/organizations:
    get:
      tags: [Organizations]
      summary: List organizations visible to the caller
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organization' } }
    post:
      tags: [Organizations]
      summary: Create an organization (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }, description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Organizations]
      summary: Get a single organization
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }, description: Organization }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      summary: Update organization settings (admin or organizer)
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }, description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Organizations]
      summary: Delete an organization (admin-only)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/organizations/by-slug/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Organizations]
      summary: Public organization data by slug (no auth)
      security: []
      responses:
        '200':
          description: Public org info (no organizers list)
          content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/organizations/{id}/organizers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Organizations]
      summary: Add an organizer to an organization
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties: { accountId: { type: integer } }
      responses:
        '201': { description: Added }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}/organizers/{accountId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Organizations]
      summary: Remove an organizer
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──── Organization Members ────────────────────────────────────────────────
  /api/organizations/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Organization Members]
      summary: List organization members
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200':
          description: Members with account info
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/organizations/{id}/members/request:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Organization Members]
      summary: Request membership for yourself, or add another account (admin/organizer)
      description: |
        Requires authentication (session or bearer token).

        - **No `accountId`** (or the caller's own id): creates a **pending**
          membership request for the logged-in account. Any user can do this.
        - **Another account's `accountId`**: only an admin, or an organizer of
          this organization, may do this (403 otherwise). The membership is
          created already **approved**. If that account already has a pending
          or rejected request, it is approved.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: integer
                  description: Account to add. Omit to request membership for yourself.
      responses:
        '200': { description: Existing membership returned (approved if a manager added a pending/rejected one) }
        '201': { description: Membership created — pending for self-requests, approved when added by an admin/organizer }
        '400': { description: Invalid organization ID or accountId }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Organization or account not found }

  /api/organizations/{id}/members/{accountId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Organization Members]
      summary: Approve / reject a pending membership
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected], description: "Server only accepts approved or rejected (pending is the initial state set by the request endpoint)." }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid status value }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Organization Members]
      summary: Remove a member from an organization
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──── Organization Invites ────────────────────────────────────────────────
  /api/organizations/{id}/invites:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Organization Invites]
      summary: List invites (with used-by info)
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '200':
          description: Invites
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization Invites]
      summary: Generate a new single-use invite link
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } }, description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/invites/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Organization Invites]
      summary: Validate an invite token (public)
      security: []
      responses:
        '200': { description: Returns the org info for the invite }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Invite already used }

  /api/invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [Organization Invites]
      summary: Accept an invite (public, auto-approves membership)
      description: |
        Two ways to accept:
        - **New user** (no auth needed): send `email`, `password`, `firstName`,
          `lastName` — a new account is created and joins the organization.
        - **Existing user**: call while authenticated (session or bearer token)
          with an empty body — the invite is accepted for the caller's account.

        A client-supplied `accountId` is ignored.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Empty body — accept for the authenticated caller.
                - type: object
                  required: [email, password, firstName, lastName]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string }
                    firstName: { type: string }
                    lastName: { type: string }
      responses:
        '200': { description: Accepted }
        '400': { description: Not authenticated and no new account details supplied }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Email already registered (sign in instead) }
        '410': { description: Invite already used }

  # ──── SPVs ────────────────────────────────────────────────────────────────
  /api/spvs:
    get:
      tags: [SPVs]
      summary: List all SPVs visible to the caller
      responses:
        '200':
          description: SPVs (with org info)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Spv' } } } }

  /api/organizations/{id}/spvs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [SPVs]
      summary: List SPVs for an organization
      description: Admin sees all SPVs in the org. Non-admin members of the org see only the SPVs they invest in (directly or through entities they own).
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Spv' } } } }, description: SPVs }
    post:
      tags: [SPVs]
      summary: Create an SPV under an organization
      description: Admin, or an organizer of this organization. Approved membership alone is not enough (403).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpvCreate' } } }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Spv' } } }, description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/spvs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [SPVs]
      responses: { '200': { description: SPV, content: { application/json: { schema: { $ref: '#/components/schemas/Spv' } } } } }
      summary: Get a single SPV
    patch:
      tags: [SPVs]
      summary: Update an SPV
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpvCreate' } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Spv' } } } } }
    delete:
      tags: [SPVs]
      summary: Delete an SPV (admin-only)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/spvs/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [SPVs]
      summary: List SPV members (investors), one row per tranche
      description: Admins and organizers of the SPV's organization see every member row. Non-admin investors see only their own tranches (rows where the investor is their own account or an entity they own). Non-investor non-admins receive 403.
      responses:
        '200':
          description: Each row has investorType + either an account or entity block. The same investor may appear in multiple rows (tranches), each with its own values. For non-admin investors, the response is filtered to only their own rows.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SpvMember' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SPVs]
      summary: Add an investor position / tranche (account OR entity, never both). Calling multiple times for the same investor creates additional tranches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: integer, nullable: true }
                entityId: { type: integer, nullable: true }
                date: { type: string, format: date, nullable: true, description: "Investment date." }
                committed: { type: string, description: "Total commitment (gross)." }
                managementFee: { type: string, description: "Management fee charged on this position." }
                otherFee: { type: string, description: "Any other fee charged on this position." }
                carry: { type: string, description: "Carry / Success Fee percentage (0-100) for this position. Stored per tranche; informational only — not subtracted from capital." }
                totalCalled: { type: string, description: "Capital actually called from the investor so far." }
                distributed: { type: string, description: "Distributions paid back to the investor." }
                ownershipPercent: { type: string, nullable: true, description: "Explicit ownership % (0–100). Only meaningful when the SPV's allocationMethod is 'Custom'." }
      responses:
        '201': { description: Added }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/spvs/{id}/members/{memberId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: memberId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [SPVs]
      summary: Update investment fields for a specific tranche
      responses: { '200': { description: Updated } }
    delete:
      tags: [SPVs]
      summary: Remove a specific tranche from an SPV
      responses: { '200': { description: Removed } }

  # ──── Entities ────────────────────────────────────────────────────────────
  /api/spvs/{id}/assets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [SPVs]
      summary: List the SPV's assets (financial instruments). Read access mirrors SPV read access.
      responses:
        '200': { description: Assets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SpvAsset' } } } } }
    post:
      tags: [SPVs]
      summary: Add an asset to the SPV. Requires admin or organization organizer. Cost may exceed current `spv.cash` (cash will simply go negative).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName: { type: string }
                instrumentType: { type: string, example: "Equity" }
                purchaseDate: { type: string, format: date, nullable: true }
                cost: { type: string, description: "Initial cost. May exceed current SPV cash (cash will go negative)." }
                notes: { type: string }
                isDefault: { type: boolean, description: "Mark this asset as the SPV's default. Auto-clears the flag on any other asset in the same SPV." }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SpvAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/spvs/{id}/assets/{assetId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: assetId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [SPVs]
      summary: Update an asset's fields. Admin or organizer only.
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SpvAsset' } } } } }
    delete:
      tags: [SPVs]
      summary: Delete an asset (cascades valuations). Admin or organizer only.
      responses: { '200': { description: Deleted } }

  /api/spvs/{id}/assets/{assetId}/valuations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: assetId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [SPVs]
      summary: List the asset's valuation history (newest first).
      responses:
        '200': { description: Valuations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SpvAssetValuation' } } } } }
    post:
      tags: [SPVs]
      summary: Add a new valuation (mark) for the asset. Admin or organizer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, value]
              properties:
                date: { type: string, format: date }
                value: { type: string }
                note: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SpvAssetValuation' } } } }

  /api/spvs/{id}/assets/{assetId}/valuations/{valuationId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: assetId, in: path, required: true, schema: { type: integer } }
      - { name: valuationId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [SPVs]
      summary: Delete a valuation. Admin or organizer only.
      responses: { '200': { description: Deleted } }

  /api/entities:
    get:
      tags: [Entities]
      summary: List entities visible to the caller
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Entity' } } } }, description: Entities }
    post:
      tags: [Entities]
      summary: Create an entity
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityCreate' } } }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } }, description: Created }

  /api/entities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities]
      responses: { '200': { description: Entity, content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } } }
      summary: Get a single entity
    patch:
      tags: [Entities]
      summary: Update an entity
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityCreate' } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } } }
    delete:
      tags: [Entities]
      summary: Delete an entity (admin-only) — cascades owners/managers
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/entities/{id}/owners:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities]
      summary: List entity owners (accounts and/or other entities)
      responses: { '200': { description: Owners } }
    post:
      tags: [Entities]
      summary: Add an owner (account or another entity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerType, ownershipPercent]
              properties:
                ownerType: { type: string, enum: [account, entity] }
                ownerAccountId: { type: integer, nullable: true }
                ownerEntityId: { type: integer, nullable: true }
                ownershipPercent: { type: string }
      responses: { '201': { description: Added } }

  /api/entities/{id}/owners/{ownerId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: ownerId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Entities]
      summary: Remove an owner
      responses: { '200': { description: Removed } }

  /api/entities/{id}/managers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities]
      summary: List entity managers
      responses: { '200': { description: Managers } }
    post:
      tags: [Entities]
      summary: Add an account as a manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties: { accountId: { type: integer } }
      responses: { '201': { description: Added } }

  /api/entities/{id}/managers/{accountId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: accountId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Entities]
      summary: Remove a manager
      responses: { '200': { description: Removed } }

  # ──── Documents ───────────────────────────────────────────────────────────
  /api/documents:
    get:
      tags: [Documents]
      summary: List documents visible to the caller
      description: |
        Admins see every document. Non-admins see documents owned by their
        own account, plus documents owned by entities they own (recursively,
        via `entity_owners`) or manage (via `entity_managers`).
      responses:
        '200':
          description: Documents (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Documents]
      summary: Upload a document (admin-only, multipart)
      description: |
        Multipart upload, max 100 MB. Each document must be associated with
        **exactly one** owner — provide either `accountId` (when
        `ownerType=account`) or `entityId` (when `ownerType=entity`).

        `folderPath` is a virtual path made of `/`-separated segments
        (e.g. `"SPVs/RS Kushki"`). Segments are sanitized server-side
        (illegal chars become `_`, `..` is stripped).

        On disk the file is written under
        `<storage_path>/{account|entity}/<id>/<folderPath>/<original-name>-<timestamp>-<rand>.<ext>`,
        so an entity's documents never collide with an account's.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ownerType]
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary contents (≤ 100 MB).
                name:
                  type: string
                  description: Display name. Defaults to the uploaded file's original name.
                folderPath:
                  type: string
                  example: "SPVs/RS Kushki"
                  description: Virtual folder path; `/`-separated. Empty = root.
                ownerType:
                  type: string
                  enum: [account, entity]
                accountId:
                  type: integer
                  description: Required when `ownerType=account`.
                entityId:
                  type: integer
                  description: Required when `ownerType=entity`.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/documents/{id}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Documents]
      summary: Stream the file's binary contents
      description: |
        Visibility-filtered using the same rules as `GET /api/documents`.
        Returns `Content-Disposition: attachment` with the original filename.
        Returns `410 Gone` if the DB row exists but the file is missing on disk.
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: File missing on disk (DB row still present)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Documents]
      summary: Delete a document (admin-only)
      description: Removes the database row **and** the file on disk.
      responses:
        '200': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──── Settings ────────────────────────────────────────────────────────────
  /api/settings/documents-path:
    get:
      tags: [Settings]
      summary: Get the document storage path (admin-only)
      description: |
        Returns the `configured` value (empty string if unset), the
        `effective` absolute path actually used (resolved from configured or
        the default), and the `default` path.
      responses:
        '200':
          description: Storage path info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentsPathSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Settings]
      summary: Set the document storage path (admin-only)
      description: |
        Pass an absolute or relative filesystem path in `value`. Empty string
        falls back to the default (`./uploads/documents`). The path is
        created on demand. Existing files are not migrated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: Filesystem path; empty string = default.
      responses:
        '200':
          description: Updated path info
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: string }
                  effective: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──── Currencies ──────────────────────────────────────────────────────────
  /api/currencies:
    get:
      tags: [Currencies]
      summary: List the currency catalog
      description: |
        Returns every known currency (active and inactive). `active`
        currencies are the ones selectable as an SPV's currency on creation
        and offered in the dashboard's "view in" dropdown.
      responses:
        '200':
          description: Currency catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Currency' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/currencies/{code}:
    patch:
      tags: [Currencies]
      summary: Activate or deactivate a currency (admin-only)
      description: |
        USD is the platform's base reporting currency and the exchange-rate
        pivot — it can never be deactivated. Activating a currency triggers
        an immediate best-effort exchange-rate fetch rather than waiting for
        the next scheduled refresh.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: EUR }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Updated currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Currency' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exchange-rates:
    get:
      tags: [Currencies]
      summary: Latest known exchange rates
      description: |
        Rates are expressed as "USD per 1 unit of the currency" (USD itself
        is always 1) and refreshed at most once a day from a public FX feed.
        No history is kept — only the latest rate per currency.
      responses:
        '200':
          description: Exchange rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/exchange-rates/refresh:
    post:
      tags: [Currencies]
      summary: Force an immediate exchange-rate refresh (admin-only)
      description: Mainly for troubleshooting a stale or missing rate; the daily refresh otherwise runs automatically.
      responses:
        '200':
          description: Refreshed exchange rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──── Portfolio ───────────────────────────────────────────────────────────
  /api/portfolio:
    get:
      tags: [Portfolio]
      summary: Investment positions (admin sees all; non-admin sees own)
      description: |
        Optional filters:
        - `?accountId=<id>` — investments owned directly by the account *plus*
          investments held by entities the account owns (recursively, via
          `entity_owners`). Non-admins may only request their own accountId.
        - `?entityId=<id>` — investments held directly by that entity.
          Non-admins must own or manage the entity.
      parameters:
        - { name: accountId, in: query, schema: { type: integer } }
        - { name: entityId, in: query, schema: { type: integer } }
      responses:
        '200': { description: Portfolio positions }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ──────────────────────────────────────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Set automatically by `POST /api/auth/login`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ff_<48 hex chars>
      description: |
        Personal API token created via `POST /api/auth/tokens` (admin-only).
        Tokens inherit the owner's roles.

  responses:
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication required or rejected
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but lacks permission
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: admin }
        description: { type: string, nullable: true }

    Account:
      type: object
      description: User account. `passwordHash` is NEVER included in API responses.
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        profileComplete: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    AccountCreate:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 1
          description: |
            Optional. Omit it to have the welcome email send the user a link to
            create their own password instead (requires `welcome_email` to be true).
        firstName: { type: string }
        lastName: { type: string }
        roles:
          type: array
          items: { type: string }
          example: [admin]
          description: Role names to assign (e.g. `admin`). Unknown names are ignored. Defaults to no roles.
        welcome_email:
          type: boolean
          default: true
          description: |
            Send the new user a welcome email in the account's `language`.
            With a `password`, it contains the login email, password and a
            sign-in link; without one, it contains the login email and a link to
            create a password. Defaults to true; pass `false` to skip it (only
            allowed when a `password` is provided).

    AccountUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        roles:
          type: array
          items: { type: string }
          example: [admin]
          description: |
            Role names (e.g. `admin`). Replaces the account's role assignments
            wholesale — send `[]` to remove all roles. Unknown names are ignored.
            Admin only: for non-admin callers this field is silently stripped
            (the rest of the update still applies).
        password:
          type: string
          minLength: 6
          description: Admin only. Directly sets a new password for the account.
        welcome_email:
          type: boolean
          default: false
          description: |
            Only used together with `password`. When true, emails the user their
            login email and the new password (in the account's `language`).

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string, description: URL-friendly slug for the public landing page }
        description: { type: string, nullable: true }
        website: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateProvince: { type: string, nullable: true }
        organizers:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        website: { type: string }
        country: { type: string }
        city: { type: string }
        stateProvince: { type: string }

    Member:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        accountId: { type: integer }
        status: { type: string, enum: [pending, approved, rejected] }
        inviteId: { type: integer, nullable: true }
        account: { $ref: '#/components/schemas/Account' }

    Invite:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        token: { type: string, description: Use in /org/:slug?invite=TOKEN }
        used: { type: boolean }
        usedByAccountId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    Spv:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        organizationName: { type: string }
        legalName: { type: string }
        displayName: { type: string }
        entityType: { type: string }
        currency: { type: string, example: "USD", description: "ISO 4217 code. Set once at creation (see SpvCreate) and immutable afterward — every investment into the SPV is denominated in it. PATCH /api/spvs/:id silently ignores this field." }
        allocationMethod: { type: string }
        managementFeePercent: { type: string }
        carriedInterestPercent: { type: string }
        preferredReturnPercent: { type: string }
        totalBeingRaised: { type: string }
        minimumInvestment: { type: string }
        cash: { type: string, description: "DERIVED. = sum(member.totalCalled) − sum(asset.cost). Returned, never stored." }
        assetValue: { type: string, description: "DERIVED. = sum(asset.currentValue) where asset.currentValue is its latest valuation (or cost if none)." }
        currentValue: { type: string, description: "DERIVED. = cash + assetValue." }
        autoDeploy: { type: boolean, description: "When true, every new investment added to the SPV is auto-called for its NET capital (totalCalled = committed − managementFee − otherFee) and that net amount is added to the default asset's cost (at original cost, not current value). Fees stay on the member as fees and are not deployed. Requires a default asset; otherwise POST /members returns 400." }
        members:
          type: array
          items: { $ref: '#/components/schemas/SpvMember' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SpvAsset:
      type: object
      description: A financial instrument owned by an SPV.
      properties:
        id: { type: integer }
        spvId: { type: integer }
        companyName: { type: string }
        instrumentType: { type: string, example: "Equity", description: "Equity, Convertible Note, SAFE, Preferred Stock, Common Stock, Warrant, Debt, Other." }
        purchaseDate: { type: string, format: date, nullable: true }
        cost: { type: string, description: "Initial cost paid from SPV cash." }
        notes: { type: string }
        isDefault: { type: boolean, description: "At most one asset per SPV can be the default. The default asset receives AutoDeploy capital." }
        currentValue: { type: string, description: "DERIVED. = latest SpvAssetValuation.value (by date), or cost when no valuations exist." }

    SpvAssetValuation:
      type: object
      properties:
        id: { type: integer }
        assetId: { type: integer }
        date: { type: string, format: date }
        value: { type: string }
        note: { type: string }

    SpvCreate:
      type: object
      required: [legalName, displayName, entityType]
      properties:
        legalName: { type: string }
        displayName: { type: string }
        entityType: { type: string, example: LLC }
        currency: { type: string, example: "USD", default: "USD", description: "ISO 4217 code; must be one of the platform's active currencies (GET /api/currencies). Defaults to USD. Cannot be changed after creation." }
        allocationMethod:
          type: string
          enum: ["By Commitment", "By Capital Invested", "Custom"]
          example: "By Commitment"
          description: |
            How ownership % in the SPV is calculated:
            - **By Commitment**: each investor's share = their `committed` divided by the SPV's total `committed`.
            - **By Capital Invested**: each investor's share = `capital` (= `committed` − `managementFee` − `otherFee`) divided by the total of `capital` across all members.
            - **Custom**: ownership is set explicitly per investor via `ownershipPercent`.
        managementFeePercent: { type: string }
        carriedInterestPercent: { type: string }
        preferredReturnPercent: { type: string }
        totalBeingRaised: { type: string }
        minimumInvestment: { type: string }

    SpvMember:
      type: object
      description: One investor in an SPV — exactly one of account/entity is non-null.
      properties:
        id: { type: integer }
        spvId: { type: integer }
        investorType: { type: string, enum: [account, entity] }
        date: { type: string, format: date, nullable: true }
        committed: { type: string, description: "Total commitment (gross)." }
        managementFee: { type: string }
        otherFee: { type: string }
        carry: { type: string, description: "Carry / Success Fee percentage (0-100) for this tranche. Informational only; not subtracted from capital." }
        totalCalled: { type: string, description: "Capital called from the investor so far." }
        distributed: { type: string, description: "Distributions paid back to the investor." }
        ownershipPercent: { type: string, nullable: true, description: "Explicit ownership % (0–100) used only when the SPV's allocationMethod is 'Custom'." }
        currentValue: { type: string, description: "DERIVED. = ownership share × spv.currentValue. Returned on responses; cannot be set." }
        # Derived (NOT stored, computed server-side):
        #   capital              = committed − (managementFee + otherFee)
        #   commitmentRemaining  = capital − totalCalled
        #   currentValue         = ownership% × spv.currentValue
        account: { $ref: '#/components/schemas/Account', nullable: true }
        entity: { $ref: '#/components/schemas/Entity', nullable: true }

    Entity:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        entityType: { type: string, example: LLC }
        currency: { type: string }
        ownershipAllocation: { type: string, enum: [percent, shares] }
        disbursementMethod: { type: string }
        owners: { type: array, items: { type: object } }
        managers: { type: array, items: { $ref: '#/components/schemas/Account' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EntityCreate:
      type: object
      required: [name, entityType]
      properties:
        name: { type: string }
        entityType: { type: string }
        currency: { type: string }
        ownershipAllocation: { type: string, enum: [percent, shares] }
        disbursementMethod: { type: string }

    Document:
      type: object
      description: |
        A file attached to either an Account or an Entity. Exactly one of
        `accountId` / `entityId` is non-null. The on-disk file lives at
        `<storage_path>/<storedPath>` — the API never exposes the absolute
        filesystem path; use `GET /api/documents/{id}/download` to fetch the
        contents.
      properties:
        id: { type: integer }
        name:
          type: string
          description: Display name. Defaults to the uploaded file's original name.
        folderPath:
          type: string
          description: Sanitized virtual folder path (slash-separated).
          example: "SPVs/RS Kushki"
        ownerType: { type: string, enum: [account, entity] }
        accountId: { type: integer, nullable: true }
        entityId: { type: integer, nullable: true }
        fileName:
          type: string
          description: Original filename as uploaded by the client.
        storedPath:
          type: string
          description: Path under the storage root (server-internal; do not rely on its exact format).
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploadedBy: { type: integer, description: "Account id of the admin who uploaded the file." }
        owner:
          type: object
          nullable: true
          description: Resolved owner summary.
          properties:
            id: { type: integer }
            type: { type: string, enum: [account, entity] }
            name: { type: string }
        uploader:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        createdAt: { type: string, format: date-time }

    DocumentsPathSettings:
      type: object
      properties:
        configured:
          type: string
          description: Raw value stored in `app_settings` (empty string if unset).
        effective:
          type: string
          description: Absolute path actually used (resolved from `configured` or `default`).
        default:
          type: string
          description: Default path used when `configured` is empty.

    Currency:
      type: object
      properties:
        code: { type: string, example: "EUR", description: "ISO 4217 code." }
        name: { type: string, example: "Euro" }
        symbol: { type: string, example: "€" }
        active: { type: boolean, description: "Whether this currency is selectable for new SPVs and in the dashboard's currency dropdown. USD is always active." }

    ExchangeRates:
      type: object
      properties:
        base: { type: string, example: "USD", description: "Pivot currency — always USD." }
        rates:
          type: object
          additionalProperties: { type: number }
          example: { USD: 1, EUR: 1.0825 }
          description: "USD per 1 unit of each active currency's code (USD itself is always 1)."
        updatedAt: { type: string, format: date-time, nullable: true, description: "Most recent refresh timestamp across all stored rates; null if none have been fetched yet." }

    PublicApiToken:
      type: object
      description: API token metadata (the secret hash is NEVER included).
      properties:
        id: { type: integer }
        accountId: { type: integer }
        name: { type: string }
        prefix:
          type: string
          description: First 8 hex chars after `ff_` — safe to log for debugging.
          example: "a1b2c3d4"
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
