<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FundFlow{% endblock %} | FundFlow</title>
  <meta name="description" content="Multi-tenant fund management platform for VC and PE investments">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full bg-gray-50 font-sans text-gray-900 antialiased" x-data="{ sidebarOpen: true }" hx-boost="true">

  <div class="flex h-full">
    {% include "_sidebar.html" %}

    <div class="flex-1 flex flex-col min-w-0 transition-all duration-200" :class="sidebarOpen ? 'ml-64' : 'ml-16'">
      <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-gray-200 bg-white/80 backdrop-blur px-5 h-14">
        <button @click="sidebarOpen = !sidebarOpen" class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition" data-testid="button-sidebar-toggle">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex-1"></div>
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 rounded-full bg-brand-600 flex items-center justify-center text-white text-xs font-semibold">SA</div>
          <div class="hidden sm:block">
            <p class="text-sm font-medium leading-none">System Admin</p>
            <p class="text-xs text-gray-500">Platform Admin</p>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-auto">
        {% if messages %}
        <div class="px-6 pt-4">
          {% for message in messages %}
          <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 4000)" x-transition
               class="mb-2 flex items-center gap-2 rounded-lg px-4 py-3 text-sm
                      {% if message.tags == 'success' %}bg-emerald-50 text-emerald-800 border border-emerald-200
                      {% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
                      {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
            <span class="flex-1">{{ message }}</span>
            <button @click="show = false" class="text-current opacity-50 hover:opacity-100">&times;</button>
          </div>
          {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

</body>
</html>
